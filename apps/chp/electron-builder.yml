appId: com.chp.desktop
productName: chp
asar: true
directories:
  output: release
  buildResources: build
files:
  - src/**/*
  - package.json
extraFiles:
  - from: portable.flag
    to: portable.flag
win:
  executableName: chp
  icon: build/chp.ico
  target:
    - target: dir
artifactName: chp-${version}-${arch}.${ext}
