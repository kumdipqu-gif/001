name: Import LobeHub v2.2.14

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: startsWith(github.event.issue.title, '[IMPORT] LobeHub v2.2.14') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch official LobeHub v2.2.14
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.2.14 https://github.com/lobehub/lobehub.git /tmp/lobehub
          cp .github/workflows/import-lobehub.yml /tmp/import-lobehub.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/lobehub/ ./
          mkdir -p .github/workflows
          cp /tmp/import-lobehub.yml .github/workflows/import-lobehub.yml

      - name: Commit complete upstream baseline
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'ChatGPT Workbench Builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore: import LobeHub v2.2.14 baseline'
          git push --force origin main
